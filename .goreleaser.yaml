version: 2
project_name: seqfetch

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/seqfetch
    binary: seqfetch
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # -s strips the symbol table, -w strips DWARF debug info.
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: oswaldom-code
    name: SeqFetch
