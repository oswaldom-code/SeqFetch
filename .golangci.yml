version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Ginkgo/Gomega rely on dot imports by design.
      - path: _test\.go
        linters: [revive]
        text: dot-imports
      - path: _test\.go
        linters: [staticcheck]
        text: ST1001

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/oswaldom-code/seqfetch
